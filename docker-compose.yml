version: '3.9'
services:
  tempmail:
    image: ${TEMPMAIL_IMAGE:-ghcr.io/clockclock1/tempmail:latest}
    container_name: tempmail
    restart: unless-stopped
    volumes:
      - ./data/backend:/app/data
      - ./config/config.yaml:/app/config/config.yaml
    ports:
      - "8080:8080"
      - "2525:2525"
