version: '3.9'
services:
  tempmail:
    image: ${TEMPMAIL_IMAGE:-ghcr.io/clockclock1/tempmail:latest}
    container_name: tempmail
    restart: unless-stopped
    volumes:
      - ./data/backend:/app/data
      - ./config:/app/config
    ports:
      - "8080:8080"
      - "${TEMPMAIL_SMTP_PORT:-25}:2525"
